<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生电影｜免费内测版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px 60px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:22px;margin:12px 0}h1{font-size:30px;margin:8px 0}.gold{color:#d7b36a}.muted{color:#999;line-height:1.8}.small{font-size:13px;color:#777}.progress{height:4px;background:#292929;border-radius:9px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#d7b36a}.q{font-size:21px;line-height:1.55;margin:18px 0}.option,.btn{width:100%;border-radius:13px;padding:15px;font-size:16px}.option{display:block;text-align:left;background:#171717;border:1px solid #303030;color:#eee;margin:10px 0}.btn{border:0;background:#d7b36a;color:#111;font-weight:700;margin-top:14px}.ghost{background:transparent;color:#d7b36a;border:1px solid #66542f}.tag{display:inline-block;border:1px solid #66542f;color:#d7b36a;border-radius:99px;padding:6px 10px;margin:4px;font-size:13px}.chapter{border-top:1px solid #292929;padding:21px 0}.chapter h2{font-size:19px;margin:0 0 10px}.chapter p{line-height:1.9;color:#ddd}.quote{border-left:3px solid #d7b36a;background:#151515;padding:12px 15px;line-height:1.8}.test{display:inline-block;background:#201a0d;border:1px solid #66542f;color:#d7b36a;padding:7px 10px;border-radius:10px;font-size:12px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const questions=[
["如果今天完全不用考虑钱，你最想把接下来的半年过成什么样？",["去很多地方，看看不同的生活","留在一个喜欢的地方，好好生活","做一件一直想做、但没开始的事","我其实还没想清楚，只想先停下来"]],
["如果家里人希望你走一条“更稳妥”的路，你通常会怎么做？",["先听他们的，再慢慢做自己的决定","表面答应，但最后还是按自己的想法来","会很纠结，怕让他们失望","只要我觉得不对，就会直接拒绝"]],
["下面哪句话更像你最近的状态？",["我知道自己想要什么，只是还没做到","我想改变，但不知道从哪里开始","我好像一直在赶路，却不知道去哪","我越来越想过一种和别人不太一样的生活"]],
["如果有一个机会，成功后会彻底改变生活，但失败成本也不低，你会？",["先冲了再说","先把最坏的情况算清楚","想很久，最后可能还是不敢","看当时的感觉，如果真的很想要就会试"]],
["你最羡慕别人身上的哪一种东西？",["自由","稳定和安心","说走就走的勇气","很清楚自己要什么"]],
["当你发现一件事越来越不适合自己，你更可能？",["马上离开","先忍一阵，再找出口","反复想是不是自己要求太高","即使舍不得，也会逼自己做改变"]],
["如果未来五年只能保留一种感觉，你更想要？",["自由","安全感","成就感","平静"]],
["你最害怕自己以后回头看现在时，发现什么？",["什么都没去尝试","为了别人活成了不是自己的样子","一直很努力，却没有得到想要的生活","明明有机会改变，却一直拖着"]],
["如果人生是一部电影，你觉得自己现在更像哪一幕？",["准备离开原来的生活","站在岔路口","已经离开，但还没到新的地方","表面平静，心里其实正在发生变化"]],
["如果没人评价你，也没人失望，你会更想选择哪种人生？",["到处生活、到处看看","做自己真正喜欢的事","拥有足够的钱和选择权","找一个喜欢的人和地方，安稳地过日子"]]
];
let i=0,a=[];const app=document.getElementById('app');
function home(){app.innerHTML='<div class="card"><span class="test">免费内测版｜完整报告开放</span><h1>人生<span class="gold">电影</span></h1><p class="muted">如果你的人生是一部电影，<br>你现在演到哪一幕？</p><p class="small">不是算命，也不是心理诊断。根据你的选择，生成一份属于你的“人生电影”解读。</p><button class="btn" onclick="start()">开始测试</button></div>'}
function start(){i=0;a=[];q()}
function q(){let [t,o]=questions[i];app.innerHTML='<div class="card"><div class="small">第 '+(i+1)+' / '+questions.length+' 题</div><div class="progress"><div class="bar" style="width:'+(i/questions.length*100)+'%"></div></div><div class="q">'+t+'</div>'+o.map((x,n)=>'<button class="option" onclick="pick('+n+')">'+x+'</button>').join('')+(i?'<button class="btn ghost" onclick="back()">← 返回上一题</button>':'')+'</div>'}
function pick(n){a[i]=n;i++;i<questions.length?q():preview()}
function back(){i--;q()}
function preview(){app.innerHTML='<div class="card"><span class="test">完整报告免费开放</span><h1>你的电影，<span class="gold">可以开场了。</span></h1><p class="muted">你已经完成全部问题。下面直接查看原本“付费解锁”后的完整分析。</p><div class="quote">真正有意思的不是“你是什么类型”，而是：你为什么一次次做出这样的选择？</div><button class="btn" onclick="report()">查看完整人生电影报告</button><button class="btn ghost" onclick="i=questions.length-1;q()">返回修改答案</button></div>'}
function ch(h,p){return '<section class="chapter"><h2>'+h+'</h2><p>'+p+'</p></section>'}
function report(){let c=[0,0,0,0];a.forEach(x=>c[x]++);let free=c[0]+c[3],safe=c[1],change=c[2]+c[3];let title=free>=safe+1?'《还没有散场的人生》':'《站在岔路口的人》';let sub=free>=safe?'你不是没有方向，你只是越来越不愿意用自由交换一种看起来正确的生活。':'你并不是没有选择，只是你开始认真计算：什么值得坚持，什么值得放下。';let scene=free>=change?'你现在更像电影里准备离开原有轨道的那一幕。真正发生变化的，可能还不是地点，而是你对“应该怎样生活”的看法。':'你现在像站在岔路口：旧的生活还没有完全结束，新的生活也还没有真正开始。你已经很难再假装自己没有别的可能。';let want=free>=safe?'你真正想要的并不只是某一个具体结果，而是选择权。你希望自己的时间、地点和生活方式，不必永远由别人替你决定。':'你在意的东西里有一个很强的关键词：安心。你不是不想改变，而是希望改变之后仍然有一个可以站稳的地方。';let conflict=free>=safe?'你最大的矛盾是“自由”和“确定性”。你想走远一点，又知道自由意味着承担更多不确定。':'你最大的矛盾是“安全”和“成为自己”。你知道稳妥有价值，但也越来越在意：如果一直稳妥下去，那还是不是你想过的人生？';let miss=change>=2?'你最容易错过的不是机会，而是“开始”。你很容易先想清楚所有后果，再决定要不要迈出第一步。':'你最容易错过的是那些没有明确答案的可能性。真正重要的选择，往往不会在一开始就告诉你“这是正确答案”。';let regret=free>=safe?'如果未来的你回头看，最可能在意的不是“我当时赚了多少”，而是“我有没有真的去过我想去的地方，成为我想成为的人”。':'你未来可能最在意的一件事，是有没有为了所谓的稳定，把真正想做的事情推得太远。';let A='如果继续沿着现在的轨道走，你会得到更多熟悉感和确定性。它未必不好，只是你可能会越来越清楚：自己究竟是在选择，还是在习惯。';let B='如果你真的换一条路，前期很可能并不浪漫。会有钱、能力、关系、身份等现实问题。但那条路的价值在于：你开始亲手决定生活的边界。';let movie=free>=safe?'《白日梦想家》':'《楚门的世界》';let end=free>=safe?'下一幕不一定要立刻远走高飞。真正的改变，是你开始把“我想要什么”放在“别人觉得我应该怎样”之前。':'你不需要今天就把人生改写。你只需要承认：有些旧答案已经不再适合现在的你。承认这一点，本身就是下一幕的开始。';app.innerHTML='<div class="card"><span class="test">完整报告｜内测免费</span><h1>'+title+'</h1><p class="gold">'+sub+'</p><span class="tag">自由</span><span class="tag">安全感</span><span class="tag">选择权</span><span class="tag">改变</span></div><div class="card">'+ch('01｜电影海报','你的电影名：'+title+'<br>副标题：'+sub)+ch('02｜你现在正处于人生的哪一幕',scene)+ch('03｜你真正想要的东西',want)+ch('04｜你的选择模式','从你的回答里，一个很明显的模式是：你并不只是寻找“好不好”的答案，而是在寻找“是不是属于我”的答案。你会把自由、安心、尝试和未来的自己放在一起衡量。')+ch('05｜人生最大的矛盾',conflict)+ch('06｜别人眼中的你 vs 真实的你','别人可能只看到你做出的决定，却看不到决定之前的那段挣扎。你看起来可能比实际更坚定；但真正的你，往往会把代价想得很清楚。')+ch('07｜你最容易错过的东西',miss)+ch('08｜平行人生','A｜留在现在的轨道：'+A+'<br><br>B｜彻底改变：'+B)+ch('09｜三个关键节点','① 当你第一次认真说“不想再这样了”。<br>② 当一个现实机会逼你在安全和可能性之间做选择。<br>③ 当你发现自己已经拥有重新开始的能力。')+ch('10｜最容易后悔的选择',regret)+ch('11｜隐藏结局','你的人生并没有一个被写好的隐藏结局。真正隐藏的东西，是你现在还没有完全承认的那部分欲望。它可能不是“我要成功”，而是“我想按照自己的方式活一次”。')+ch('12｜AI 为你写的电影终章','电影 '+movie+' 的气质，也许能成为一个镜子：不是告诉你应该怎么活，而是提醒你，人生真正发生变化的时候，往往从一个很小的“我想试试”开始。<br><br>'+end+'<br><br><strong>下一幕，不是别人写好的。它正在等你自己写下去。</strong>')+'</div><div class="card"><p class="small">本产品用于自我探索与娱乐，不构成心理诊断、医疗、职业或人生决策建议。</p><button class="btn ghost" onclick="start()">再测一次</button></div>'}
home();
</script></body></html>
